# ============================================================
# DIVINITTYS — CI/CD Pipeline
# ============================================================
# package-lock.json must be committed (required by setup-node cache
# and by npm ci).
#
# Peer dependencies: next-auth (nodemailer optional) and
# @bull-board/hono (hono). Install uses --legacy-peer-deps to match
# the production Dockerfile and avoid strict peer failures in CI.
# hono is also listed as a direct dependency for clarity.
# ============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  # Opt into Node.js 24 runtime for Actions to suppress deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Shared Prisma flag — skip engine binary download in CI
  PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: '1'
  # Disable Next.js telemetry in all jobs
  NEXT_TELEMETRY_DISABLED: '1'
  # CI JWT secrets (non-sensitive — only for test token signing)
  JWT_SECRET:         'ci-test-jwt-secret-minimum-32-chars-divinittys!!'
  JWT_REFRESH_SECRET: 'ci-test-refresh-secret-minimum-32-chars-divinittys!!'

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1 — Unit + Integration + Smoke Tests
  # ──────────────────────────────────────────────────────────
  unit-integration:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Align with Dockerfile: --legacy-peer-deps (bull-board/hono, next-auth peers)
      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: '1'

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Run Smoke Tests
        run: npm run test:smoke

      - name: Generate coverage report
        run: npm run test:coverage || true  # don't fail CI on threshold miss
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_number }}
          path: coverage/
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # JOB 2 — TypeScript Type Check
  # ──────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: []  # run in parallel with unit-integration

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript strict check
        run: npx tsc --noEmit

  # ──────────────────────────────────────────────────────────
  # JOB 3 — E2E Tests (Playwright) — push only
  # ──────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run on push (not PRs) — E2E is expensive and needs services
    if: github.event_name == 'push'
    # Only run after unit + type checks pass
    needs: [unit-integration, typecheck]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: divinittys
          POSTGRES_PASSWORD: divinittys_secret
          POSTGRES_DB: divinittys_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://divinittys:divinittys_secret@localhost:5432/divinittys_test
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
      NODE_ENV: development
      # MinIO not available in CI — images will use placeholder
      MINIO_ENDPOINT: localhost
      MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: imagenes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      # Cache Playwright binaries separately (large download, rarely changes)
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps (cache miss)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run DB migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npx tsx prisma/seed.ts

      - name: Build Next.js application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: '1'

      - name: Start Next.js server (production mode)
        run: npm run start &

      - name: Wait for server (health check)
        run: |
          echo "Waiting for http://localhost:3000/api/health ..."
          for i in $(seq 1 40); do
            HTTP_CODE=$(curl -s -o /tmp/health_response.json -w "%{http_code}" \
              --max-time 5 \
              http://localhost:3000/api/health 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Server ready after ${i} attempts (HTTP 200)"
              cat /tmp/health_response.json
              exit 0
            elif [ "$HTTP_CODE" = "503" ]; then
              echo "❌ Server returned 503 (database unavailable)"
              cat /tmp/health_response.json
              exit 1
            fi

            echo "  Attempt $i/40 — HTTP ${HTTP_CODE} — retrying in 3s..."
            sleep 3
          done

          echo "❌ Server did not respond within 120 seconds"
          echo "--- Last health response ---"
          curl -v http://localhost:3000/api/health 2>&1 || true
          exit 1

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14

      - name: Upload E2E failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-${{ github.run_number }}
          path: test-results/
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # JOB 4 — Docker Build Check
  # ──────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: []

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-${{ hashFiles('Dockerfile', 'package-lock.json') }}
          restore-keys: |
            docker-${{ runner.os }}-

      - name: Build Docker image (development stage)
        run: |
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to   type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --target development \
            --tag divinittys:ci-${{ github.run_number }} \
            --load \
            .
          echo "✅ Docker build successful"

      - name: Update Docker layer cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache 2>/dev/null || true
