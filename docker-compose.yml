# ============================================================
# DIVINITTYS - Docker Compose v3.1
# ============================================================
# App:     http://localhost:${PORT_APP:-3000}
# Admin:   http://localhost:${PORT_APP:-3000}/admin
#          admin@divinittys.cl / Admin123!@#
# MinIO:   http://localhost:${PORT_MINIO_CONSOLE:-9001}
# Meili:   http://localhost:${PORT_MEILI:-7700}
#
# ⚠️  CONFLICTOS DE PUERTOS — crea/edita tu .env:
#   PORT_APP=3001
#   PORT_POSTGRES=5433
#   PORT_MEILI=7701   ← si 7700 está ocupado (ver netstat -ano | findstr :7700)
#   PORT_MINIO=9100
#   PORT_MINIO_CONSOLE=9101
# ============================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: divinittys_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-divinittys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-divinittys_secret}
      POSTGRES_DB: ${POSTGRES_DB:-divinittys}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${PORT_POSTGRES:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-divinittys} -d ${POSTGRES_DB:-divinittys}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - divinittys_net

  redis:
    image: redis:7-alpine
    container_name: divinittys_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - divinittys_net

  # ─────────────────────────────────────────────────────────
  # MEILISEARCH — FIXES APLICADOS:
  #
  # FIX A) healthcheck usa /proc/net/tcp (nativo Linux, sin wget/curl)
  #   Port 7700 decimal = 1E14 hexadecimal (big-endian, uppercase)
  #   /proc/net/tcp lista sockets TCP activos en hex.
  #   Cuando Meilisearch escucha, "1E14" aparece en esa lista.
  #
  # FIX B) La app depende con condition: service_started (no service_healthy)
  #   Meilisearch tiene fallback graceful a búsqueda SQL en el código.
  #
  # FIX C) Puerto configurable: PORT_MEILI=7701 en .env si 7700 está ocupado.
  #   IMPORTANTE: el puerto INTERNO siempre es 7700 (comunicación entre contenedores).
  # ─────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: divinittys_meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-divinittys_meili_master_key_2024}
      MEILI_ENV: development
      MEILI_HTTP_ADDR: 0.0.0.0:7700
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    ports:
      - "${PORT_MEILI:-7700}:7700"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "cat /proc/net/tcp6 2>/dev/null | grep -q 1E14 || cat /proc/net/tcp 2>/dev/null | grep -q 1E14"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - divinittys_net

  minio:
    image: minio/minio:latest
    container_name: divinittys_storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-divinittys_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-divinittys_secret_2024}
    volumes:
      - minio_data:/data
    ports:
      - "${PORT_MINIO:-9000}:9000"
      - "${PORT_MINIO_CONSOLE:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - divinittys_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: divinittys_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-divinittys}:${POSTGRES_PASSWORD:-divinittys_secret}@postgres:5432/${POSTGRES_DB:-divinittys}
      REDIS_URL: redis://redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:-divinittys_meili_master_key_2024}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production_32c}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_key_change_in_prod_32c}
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TRANSBANK_API_KEY: ${TRANSBANK_API_KEY:-579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C}
      TRANSBANK_COMMERCE_CODE: ${TRANSBANK_COMMERCE_CODE:-597055555532}
      TRANSBANK_ENV: ${TRANSBANK_ENV:-integration}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      BLUEXPRESS_API_KEY: ${BLUEXPRESS_API_KEY:-}
      BLUEXPRESS_ACCOUNT: ${BLUEXPRESS_ACCOUNT:-}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-divinittys_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-divinittys_secret_2024}
      MINIO_BUCKET: divinittys-products
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "${PORT_APP:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      minio:
        condition: service_healthy
    command: >
      sh -c "
        echo '📁 Preparando directorios...' &&
        mkdir -p .next/cache &&
        echo '⏳ Aplicando migraciones...' &&
        npx prisma migrate deploy &&
        echo '🌱 Cargando datos iniciales...' &&
        npx tsx prisma/seed.ts &&
        echo '🔍 Indexando en Meilisearch (background)...' &&
        (sleep 10 && npx tsx scripts/reindex-search.ts) &
        echo '🚀 Iniciando servidor...' &&
        npm run dev
      "
    networks:
      - divinittys_net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  meili_data:

networks:
  divinittys_net:
    name: divinittys_network
    driver: bridge
