# ============================================================
# DIVINITTYS - Docker Compose
# ============================================================
# Ejecutar con: docker compose up --build
# App:          http://localhost:3000
# Admin:        http://localhost:3000/admin
#               admin@divinittys.cl / Admin123!@#
# MinIO UI:     http://localhost:9001
#
# ──────────────────────────────────────────────────────────
# ⚠️  CONFLICTOS DE PUERTOS
# Si ya tienes servicios en estos puertos, agrega un .env:
#
#   PORT_APP=3001
#   PORT_POSTGRES=5433
#   PORT_MINIO=9100
#   PORT_MINIO_CONSOLE=9101
#
# Redis NO expone puertos al host (solo acceso interno).
# Si necesitas redis-cli externo, agrega: PORT_REDIS=6380
# ============================================================

services:

  # ── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: divinittys_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-divinittys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-divinittys_secret}
      POSTGRES_DB: ${POSTGRES_DB:-divinittys}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${PORT_POSTGRES:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-divinittys} -d ${POSTGRES_DB:-divinittys}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - divinittys_net

  # ── Redis (SIN puerto al host — acceso solo interno) ─────
  redis:
    image: redis:7-alpine
    container_name: divinittys_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    # Solo descomenta si necesitas redis-cli desde fuera de Docker:
    # ports:
    #   - "${PORT_REDIS:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - divinittys_net


  # ── Meilisearch ───────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: divinittys_meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-divinittys_meili_key}
      MEILI_ENV: development
    volumes:
      - meili_data:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s   # importante: da tiempo a que Meilisearch termine de iniciar
    networks:
      - divinittys_net

  # ── MinIO (Object Storage) ───────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: divinittys_storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-divinittys_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-divinittys_secret_2024}
    volumes:
      - minio_data:/data
    ports:
      - "${PORT_MINIO:-9000}:9000"
      - "${PORT_MINIO_CONSOLE:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - divinittys_net

  # ── Next.js App ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: divinittys_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-divinittys}:${POSTGRES_PASSWORD:-divinittys_secret}@postgres:5432/${POSTGRES_DB:-divinittys}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_key_change_in_production}
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Servicios opcionales — el sistema funciona sin ellos
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TRANSBANK_API_KEY: ${TRANSBANK_API_KEY:-579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C}
      TRANSBANK_COMMERCE_CODE: ${TRANSBANK_COMMERCE_CODE:-597055555532}
      TRANSBANK_ENV: ${TRANSBANK_ENV:-integration}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      BLUEXPRESS_API_KEY: ${BLUEXPRESS_API_KEY:-}
      BLUEXPRESS_ACCOUNT: ${BLUEXPRESS_ACCOUNT:-}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-divinittys_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-divinittys_secret_2024}
      MINIO_BUCKET: divinittys-products
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-divinittys_meili_key}
      VENDOR_COMMISSION_DEFAULT: ${VENDOR_COMMISSION_DEFAULT:-0.15}
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "${PORT_APP:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    command: >
      sh -c "
        echo '📁 Preparing directories...' &&
        mkdir -p .next/cache &&
        echo '⏳ Running migrations...' &&
        npx prisma migrate deploy &&
        echo '🌱 Running seed...' &&
        npx tsx prisma/seed.ts &&
        echo '🚀 Starting dev server...' &&
        npm run dev
      "
    networks:
      - divinittys_net

  # ── BullMQ Worker ────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: divinittys_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-divinittys}:${POSTGRES_PASSWORD:-divinittys_secret}@postgres:5432/${POSTGRES_DB:-divinittys}
      REDIS_URL: redis://redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-divinittys_meili_key}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-DIVINITTYS <no-reply@divinittys.cl>}
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - divinittys_net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  meili_data:

networks:
  divinittys_net:
    name: divinittys_network
    driver: bridge
