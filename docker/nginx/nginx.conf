# ============================================================
# DIVINITTYS — Nginx Reverse Proxy
# Maneja: SSL termination, gzip, cache headers, rate limiting
# ============================================================

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Logging ───────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ── Optimizaciones base ───────────────────────────────────
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  client_max_body_size 20M;   # para upload de imágenes

  # ── Gzip ─────────────────────────────────────────────────
  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_types        text/plain text/css text/xml application/json
                    application/javascript application/xml+rss
                    application/atom+xml image/svg+xml;

  # ── Rate limiting ─────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  # ── Upstream: Next.js ─────────────────────────────────────
  upstream nextjs {
    server app:3000;
    keepalive 64;
  }

  # ── Redirect HTTP → HTTPS ─────────────────────────────────
  server {
    listen 80;
    server_name divinittys.cl www.divinittys.cl;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS: Tienda principal ───────────────────────────────
  server {
    listen 443 ssl http2;
    server_name divinittys.cl www.divinittys.cl;

    ssl_certificate     /etc/letsencrypt/live/divinittys.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/divinittys.cl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Static assets (Next.js _next/static) ─────────────────
    location /_next/static/ {
      proxy_pass http://nextjs;
      proxy_cache_bypass  $http_upgrade;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Public files ──────────────────────────────────────────
    location /uploads/ {
      proxy_pass http://nextjs;
      add_header Cache-Control "public, max-age=86400";
    }

    # ── Auth endpoints — rate limited ──────────────────────────
    location /api/auth {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://nextjs;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API endpoints ─────────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass         http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade          $http_upgrade;
      proxy_set_header   Connection       "upgrade";
      proxy_set_header   Host             $host;
      proxy_set_header   X-Real-IP        $remote_addr;
      proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
    }

    # ── App principal ─────────────────────────────────────────
    location / {
      proxy_pass         http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade          $http_upgrade;
      proxy_set_header   Connection       "upgrade";
      proxy_set_header   Host             $host;
      proxy_set_header   X-Real-IP        $remote_addr;
      proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }

  # ── MinIO API pública (imágenes) ─────────────────────────
  server {
    listen 443 ssl http2;
    server_name media.divinittys.cl;

    ssl_certificate     /etc/letsencrypt/live/divinittys.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/divinittys.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass         http://minio:9000;
      proxy_set_header   Host             $host;
      proxy_set_header   X-Real-IP        $remote_addr;
      proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      add_header         Cache-Control    "public, max-age=86400";
    }
  }
}
