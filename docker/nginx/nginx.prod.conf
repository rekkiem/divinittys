worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    upstream nextjs { server app:3000; keepalive 64; }
    upstream minio_s3 { server minio:9000; keepalive 32; }

    # Path-style S3 proxy toward MinIO (Host must be the upstream, not the public domain)
    map $request_uri $minio_cache {
        default "public, max-age=86400";
    }

    server {
        listen 80;
        server_name divinittys.cl www.divinittys.cl prep.divinittys.cl media.divinittys.cl 64.176.5.1 _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ── App: prod ─────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name divinittys.cl www.divinittys.cl;
        ssl_certificate /etc/letsencrypt/live/divinittys.cl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/divinittys.cl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Same-origin media path used by normalizeImageUrl → /media/{bucket}/{key}
        location /media/ {
            rewrite ^/media/(.*)$ /$1 break;
            proxy_pass http://minio_s3;
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control $minio_cache;
            add_header Access-Control-Allow-Origin *;
        }

        location /_next/static/ {
            proxy_pass http://nextjs;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location /uploads/ {
            proxy_pass http://nextjs;
            add_header Cache-Control "public, max-age=86400";
        }
        location /api/auth {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # ── App: prep staging ─────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name prep.divinittys.cl;
        ssl_certificate /etc/letsencrypt/live/divinittys.cl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/divinittys.cl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /media/ {
            rewrite ^/media/(.*)$ /$1 break;
            proxy_pass http://minio_s3;
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control $minio_cache;
            add_header Access-Control-Allow-Origin *;
        }

        location /_next/static/ {
            proxy_pass http://nextjs;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # ── Media CDN host → MinIO path-style ─────────────────────
    # Public URLs: https://media.divinittys.cl/{bucket}/{key}
    server {
        listen 443 ssl http2;
        server_name media.divinittys.cl;
        ssl_certificate /etc/letsencrypt/live/divinittys.cl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/divinittys.cl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://minio_s3;
            proxy_http_version 1.1;
            # CRITICAL: do NOT forward Host=media.divinittys.cl (causes MinIO 400)
            proxy_set_header Host minio:9000;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            chunked_transfer_encoding off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control $minio_cache;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        }
    }
}
