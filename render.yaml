# ============================================================
# DIVINITTYS - Render.com Deploy Configuration
# ============================================================
# Instrucciones:
# 1. Sube el proyecto a GitHub (git push)
# 2. En render.com → New → Blueprint → conecta tu repo
# 3. Render leerá este archivo y creará todos los servicios
# 4. Configura las variables secretas en Render Dashboard
# ============================================================

services:
  # ── Next.js App ──────────────────────────────────────────
  - type: web
    name: divinittys-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node server.js
    region: oregon
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: divinittys-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: divinittys-redis
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        sync: false  # Set in dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MEILISEARCH_URL
        sync: false  # Set in dashboard after creating Meilisearch
      - key: MEILISEARCH_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TRANSBANK_COMMERCE_CODE
        sync: false
      - key: TRANSBANK_API_KEY
        sync: false
      - key: TRANSBANK_ENV
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: MINIO_ENDPOINT
        sync: false  # Use Cloudflare R2 endpoint in production
      - key: MINIO_PORT
        value: "443"
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        value: divinittys-products
      - key: MINIO_USE_SSL
        value: "true"

databases:
  - name: divinittys-db
    databaseName: divinittys
    user: divinittys
    plan: starter
    region: oregon

  - type: redis
    name: divinittys-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
